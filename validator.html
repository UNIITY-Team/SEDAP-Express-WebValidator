<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEDAP Express Validator · REPMUS 2026</title>
  <link rel="stylesheet" href="src/ui/style.css?v=3" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">✦</span>
        <span><span class="brand-title">REPMUS 2026</span><span class="brand-sub">SEDAP Express · Validator</span></span>
      </a>
      <nav class="main-nav">
        <a href="index.html">← Exercise Portal</a>
        <a href="generator.html">Generator</a>
        <a href="validator.html" class="nav-active">Validator</a>
      </nav>
      <button class="nav-toggle" aria-label="Open menu">☰</button>
    </div>
  </header>
  <button id="themeToggle" title="Toggle theme">🌓</button>

  <div id="app">
    <h1 class="page-title">✔ SEDAP Express Validator</h1>
    <p class="page-sub">Paste one message per line. Fields are checked against SEDAP-Express ICD v1.4.8; every finding quotes the ICD section it is based on.</p>

    <div class="card">
      <label for="input-msg" class="section-title" style="margin-top:0">Message input <small>semicolon-separated, one message per line, Ctrl+Enter to validate</small></label>
      <textarea id="input-msg" rows="4" placeholder="OWNUNIT;5E;0191C643A8AF;DRONEONE;R;;;53.32;8.11;0;5.5;21;22;;;FGS Bayern;SFSPCLFF-------" spellcheck="false"></textarea>
      <div class="actions">
        <button id="btn-validate" class="btn">✔ Validate</button>
        <button id="btn-clear" class="btn btn-secondary">✕ Clear</button>
        <span class="spacer"></span>
        <select id="sample-picker" class="inline-select"></select>
      </div>
    </div>

    <div id="result-area" class="hidden"></div>
  </div>

  <div id="toast" class="hidden"></div>
  <script type="module" src="src/ui/validator/main.js"></script>
</body>
</html>
